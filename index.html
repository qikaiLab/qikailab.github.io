<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7kai</title>
<meta name="description" content="7kai (qikai) 的个人主页，建设中。Personal homepage, under construction.">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:title" content="7kai">
<meta property="og:description" content="个人主页建设中 · Homepage coming soon">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111'/%3E%3Ctext x='32' y='43' font-size='30' font-family='monospace' font-weight='700' text-anchor='middle' fill='%23fff'%3E7k%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #fafaf7;
    --fg: #16181d;
    --muted: #6b7280;
    --line: #e4e4de;
    --card: #ffffff;
    --accent: #2f6df6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --fg: #eceef2;
      --muted: #9097a3;
      --line: #252932;
      --card: #161a21;
      --accent: #7aa2ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.65 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 32px 16px;
  }
  main { width: 100%; max-width: 560px; }
  h1 {
    margin: 0 0 .2em;
    font-size: clamp(3.2rem, 14vw, 5rem);
    line-height: 1;
    font-weight: 800;
    letter-spacing: -.03em;
  }
  h1 span { color: var(--accent); }
  .sub { margin: 0 0 3rem; color: var(--muted); }
  .sub b { color: var(--fg); font-weight: 600; }
  h2 {
    margin: 0 0 .75rem;
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .card {
    padding: 18px 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .card .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .card p { margin: .35rem 0 0; color: var(--muted); font-size: .95rem; }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: .78rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .tag::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .tag::before { animation: none; } }
  footer { margin-top: 3rem; font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>7<span>kai</span></h1>
  <p class="sub"><b>qikai</b> · 7k<br>个人主页建设中 · Homepage coming soon</p>

  <section>
    <h2>项目 · Projects</h2>
    <div class="card">
      <div class="row"><strong>项目整理中</strong><span class="tag">即将更新</span></div>
      <p>Projects are being organized. Check back soon.</p>
    </div>
  </section>

  <footer>© 2026 7kai</footer>
</main>
</body>
</html>
